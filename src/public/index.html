<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroLoad AI</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-8 text-white">NeuroLoad AI</h1>
        
        <!-- Skills List Section -->
        <div class="mb-8">
            <div class="flex items-center justify-between cursor-pointer" 
                 onclick="toggleSkillsList()" 
                 id="skillsHeader">
                <h2 class="text-2xl font-bold mb-4 text-white">Skills</h2>
                <button class="text-gray-400 hover:text-white transition-colors">
                    <span id="skillsCollapseIcon">▼</span>
                </button>
            </div>
            <div id="skillsList" class="flex flex-wrap gap-2 transition-all duration-300">
                <!-- Skills will be added here dynamically -->
            </div>
        </div>

        <!-- AI Suggestions Section -->
        <div class="mb-8">
            <h2 class="text-2xl font-bold mb-4 flex items-center text-white">
                AI Workload Suggestions
                <button onclick="loadAISuggestions()" 
                        class="ml-4 bg-blue-600 text-white px-4 py-2 rounded-full text-sm hover:bg-blue-700">
                    Refresh Suggestions
                </button>
            </h2>
            <div id="aiSuggestions" class="bg-gray-800 rounded-lg shadow-xl p-6 text-gray-300">
                <p class="text-gray-400">Click refresh to get AI-powered workload suggestions...</p>
            </div>
        </div>

        <!-- Users Section -->
        <div class="mb-8">
            <div class="flex items-center justify-between cursor-pointer" 
                 onclick="toggleUsersList()" 
                 id="usersHeader">
                <h2 class="text-2xl font-bold mb-4 text-white">Team Members</h2>
                <div class="flex items-center">
                    <button onclick="event.stopPropagation(); showAddUserModal()" 
                            class="mr-4 bg-green-600 text-white px-4 py-2 rounded-full text-sm hover:bg-green-700">
                        Add Member
                    </button>
                    <button class="text-gray-400 hover:text-white transition-colors">
                        <span id="usersCollapseIcon">▼</span>
                    </button>
                </div>
            </div>
            <div id="membersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 transition-all duration-300">
                <!-- Members will be added here dynamically -->
            </div>
        </div>

        <!-- Add User Modal -->
        <div id="addUserModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center">
            <div class="bg-gray-800 p-6 rounded-lg shadow-xl max-w-md w-full">
                <h3 class="text-xl font-bold mb-4 text-white">Add Team Member</h3>
                <form id="addUserForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Select Jira User</label>
                        <select id="jiraUserSelect" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                            <option value="">Loading users...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Full Name</label>
                        <input type="text" id="userName" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Weekly Working Hours</label>
                        <input type="number" id="weeklyHours" value="40" min="1" max="168" 
                               class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300">Skills</label>
                        <div class="mt-2 flex flex-wrap gap-2" id="skillSelection">
                            <!-- Skills will be added here dynamically -->
                        </div>
                    </div>
                    <div class="flex justify-end gap-4 mt-6">
                        <button type="button" onclick="hideAddUserModal()" 
                                class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">
                            Cancel
                        </button>
                        <button type="submit" 
                                class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                            Add Member
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let AVAILABLE_SKILLS = [];
        
        async function loadSkills() {
            try {
                const response = await fetch('/api/skills');
                AVAILABLE_SKILLS = await response.json();
                AVAILABLE_SKILLS.sort();
                
                const skillsList = document.getElementById('skillsList');
                skillsList.innerHTML = AVAILABLE_SKILLS.map(skill => `
                    <span class="bg-gray-700 text-blue-300 px-3 py-1 rounded-full text-sm">
                        ${skill}
                    </span>
                `).join('');

                // Add initial styles for animation
                skillsList.style.maxHeight = skillsList.scrollHeight + 'px';
                skillsList.style.overflow = 'hidden';
                skillsList.style.transition = 'max-height 0.3s ease-out, opacity 0.3s ease-out';
                skillsList.style.opacity = '1';
            } catch (error) {
                console.error('Failed to load skills:', error);
                AVAILABLE_SKILLS = [];
            }
        }

        async function loadMembers() {
            await loadSkills();  // Load skills first
            try {
                const response = await fetch('/api/members');
                const members = await response.json();
                
                const membersList = document.getElementById('membersList');
                membersList.innerHTML = '';

                members.forEach(member => {
                    const memberCard = createMemberCard(member);
                    membersList.appendChild(memberCard);
                });
            } catch (error) {
                console.error('Failed to load members:', error);
            }
        }

        function createMemberCard(member) {
            const div = document.createElement('div');
            div.className = 'bg-gray-800 rounded-lg shadow-xl p-6';
            
            function getWorkloadBadge(intensity) {
                let colorClasses;
                let label;
                const percentage = Math.round(intensity * 100);
                
                if (percentage <= 30) {
                    colorClasses = 'bg-green-600 text-white';
                    label = 'Light';
                } else if (percentage <= 70) {
                    colorClasses = 'bg-yellow-600 text-white';
                    label = 'Moderate';
                } else if (percentage <= 100) {
                    colorClasses = 'bg-red-500 text-white';
                    label = 'Heavy';
                } else {
                    colorClasses = 'bg-red-700 text-white';
                    label = 'Overloaded';
                }
                
                return `
                    <div class="mt-2">
                        <span class="${colorClasses} text-sm px-3 py-1 rounded-full font-medium">
                            ${label} (${percentage}%)
                        </span>
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="flex items-start justify-between">
                    <div class="flex items-start">
                        <img src="${member.avatar}" alt="${member.name}" class="w-12 h-12 rounded-full mr-4">
                        <div>
                            <h3 class="text-lg font-semibold mb-1 text-white">${member.name}</h3>
                            ${getWorkloadBadge(member.workloadIntensity)}
                            <div class="mt-2 text-sm text-gray-400">
                                Weekly Hours: ${member.weeklyHours}h
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="mt-4">
                    <h4 class="text-sm font-semibold mb-2 text-gray-300">Skills</h4>
                    <div class="flex flex-wrap gap-2 mb-3">
                        ${member.skills.map(skill => `
                            <span class="bg-gray-700 text-blue-300 px-2 py-1 rounded-full text-xs flex items-center">
                                ${skill}
                                <button onclick="removeSkill('${member.id}', '${skill}')" 
                                        class="ml-2 text-gray-400 hover:text-gray-200">×</button>
                            </span>
                        `).join('')}
                    </div>
                    
                    <div class="mt-3">
                        <select multiple 
                                onchange="handleSkillsChange('${member.id}', this)" 
                                class="w-full text-sm border border-gray-700 rounded p-2 bg-gray-700 text-gray-200 min-h-[100px]">
                            ${AVAILABLE_SKILLS
                                .filter(skill => !member.skills.includes(skill))
                                .map(skill => `<option value="${skill}">${skill}</option>`)
                                .join('')}
                        </select>
                        <button onclick="addSelectedSkills('${member.id}')" 
                                class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700 w-full">
                            Add Selected Skills
                        </button>
                    </div>
                </div>
            `;
            
            return div;
        }

        let selectedSkillsMap = new Map();

        function handleSkillsChange(memberId, selectElement) {
            const selectedOptions = Array.from(selectElement.selectedOptions).map(option => option.value);
            selectedSkillsMap.set(memberId, selectedOptions);
        }

        async function addSelectedSkills(memberId) {
            const selectedSkills = selectedSkillsMap.get(memberId) || [];
            if (selectedSkills.length === 0) return;

            const member = await getMemberSkills(memberId);
            const updatedSkills = [...member.skills, ...selectedSkills];
            
            await updateMemberSkills(memberId, updatedSkills);
            selectedSkillsMap.delete(memberId); // Clear the selection after adding
        }

        async function removeSkill(memberId, skillToRemove) {
            const member = await getMemberSkills(memberId);
            const updatedSkills = member.skills.filter(skill => skill !== skillToRemove);
            
            await updateMemberSkills(memberId, updatedSkills);
        }

        async function getMemberSkills(memberId) {
            const response = await fetch('/api/members');
            const members = await response.json();
            return members.find(m => m.id === memberId);
        }

        async function updateMemberSkills(memberId, skills) {
            try {
                const response = await fetch(`/api/members/${memberId}/skills`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ skills })
                });

                if (response.ok) {
                    loadMembers(); // Reload to show updated skills
                } else {
                    throw new Error('Failed to update skills');
                }
            } catch (error) {
                console.error('Error updating skills:', error);
                alert('Failed to update skills. Please try again.');
            }
        }

        async function loadAISuggestions() {
            const suggestionsDiv = document.getElementById('aiSuggestions');
            try {
                const response = await fetch('/api/workload-suggestions');
                const data = await response.json();
                const parsedSuggestions = JSON.parse(data.suggestions);

                if (!parsedSuggestions.hasSuggestions) {
                    suggestionsDiv.innerHTML = '<p class="text-yellow-500">No workload redistribution suggestions at this time.</p>';
                    return;
                }

                // Modified suggestion template to ensure full account ID is used
                const suggestionsHtml = parsedSuggestions.moves.map(move => {
                    // Debug logging
                    console.log('Processing move suggestion:', {
                        taskId: move.TaskID,
                        toAssigneeId: move.ToAssigneeId,
                        fullMove: move
                    });
                    
                    return `
                    <div class="bg-gray-700 p-4 rounded-lg mb-4 flex justify-between items-start" data-task-id="${move.TaskID}">
                        <div class="flex-1">
                            <h3 class="text-xl font-bold text-white">${move.TaskName}</h3>
                            <div class="mt-2 text-gray-300">
                                <p>Task ID: ${move.TaskID}</p>
                                <p>From: ${move.FromAssignee} (${move.FromAssigneeId})</p>
                                <p>To: ${move.ToAssignee} (${move.ToAssigneeId})</p>
                                <p>Workload Impact:</p>
                                <p>- ${move.FromAssignee}: ${move.workloadChanges.from}</p>
                                <p>- ${move.ToAssignee}: ${move.workloadChanges.to}</p>
                            </div>
                        </div>
                        <div class="flex gap-2 ml-4 items-center">
                            <button onclick="acceptMove('${move.TaskID}', '${move.ToAssigneeId}')" 
                                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded"
                                    title="Reassign to ${move.ToAssignee}">
                                ✓
                            </button>
                            <button onclick="rejectMove('${move.TaskID}')"
                                    class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
                                ✗
                            </button>
                        </div>
                    </div>
                    `;
                }).join('');

                console.log('Generated HTML:', suggestionsHtml);
                suggestionsDiv.innerHTML = suggestionsHtml;
            } catch (error) {
                console.error('Error loading AI suggestions:', error);
                suggestionsDiv.innerHTML = 
                    '<p class="text-red-500">Failed to load suggestions. Please try again.</p>';
            }
        }

        async function acceptMove(taskId, newAssignee) {
            try {
                // Validate the assignee ID format
                if (!newAssignee || !newAssignee.includes(':')) {
                    throw new Error(`Invalid assignee ID format: ${newAssignee}`);
                }

                console.log('Accepting move with full details:', {
                    taskId,
                    newAssignee,
                    isFullAccountId: newAssignee.includes(':'),
                    requestBody: JSON.stringify({ newAssignee })
                });

                const response = await fetch(`/api/tasks/${taskId}/assignee`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ newAssignee })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('Error response:', errorData);
                    throw new Error(errorData.error || 'Failed to reassign task');
                }

                // Remove the suggestion from UI
                const suggestionElement = document.querySelector(`[data-task-id="${taskId}"]`);
                if (suggestionElement) {
                    suggestionElement.remove();
                }

                // Check if there are any remaining suggestions
                const remainingSuggestions = document.querySelectorAll('#aiSuggestions > div[data-task-id]');
                if (remainingSuggestions.length === 0) {
                    document.getElementById('aiSuggestions').innerHTML = 
                        '<p class="text-yellow-500">No more suggestions available. Click refresh for new suggestions.</p>';
                }

                // Refresh the members list to update workload display
                await loadMembers();

                alert('Task reassigned successfully!');
            } catch (error) {
                console.error('Error accepting move:', error);
                alert(`Failed to reassign task: ${error.message}`);
            }
        }

        function rejectMove(taskId) {
            // Remove the suggestion from the UI
            const suggestionElement = document.querySelector(`[data-task-id="${taskId}"]`);
            if (suggestionElement) {
                suggestionElement.remove();
                
                // Check if there are any remaining suggestions
                const remainingSuggestions = document.querySelectorAll('#aiSuggestions > div[data-task-id]');
                if (remainingSuggestions.length === 0) {
                    document.getElementById('aiSuggestions').innerHTML = 
                        '<p class="text-yellow-500">No more suggestions available. Click refresh for new suggestions.</p>';
                }
            }
        }

        function toggleSkillsList() {
            const skillsList = document.getElementById('skillsList');
            const collapseIcon = document.getElementById('skillsCollapseIcon');
            
            if (skillsList.style.display === 'none') {
                skillsList.style.display = 'flex';
                collapseIcon.textContent = '▼';
                // Animate expansion
                skillsList.style.maxHeight = skillsList.scrollHeight + 'px';
                skillsList.style.opacity = '1';
            } else {
                // Animate collapse
                skillsList.style.maxHeight = '0';
                skillsList.style.opacity = '0';
                setTimeout(() => {
                    skillsList.style.display = 'none';
                }, 300);
                collapseIcon.textContent = '▶';
            }
        }

        function toggleUsersList() {
            const membersList = document.getElementById('membersList');
            const collapseIcon = document.getElementById('usersCollapseIcon');
            
            if (membersList.style.display === 'none') {
                membersList.style.display = 'grid';
                collapseIcon.textContent = '▼';
                membersList.style.maxHeight = membersList.scrollHeight + 'px';
                membersList.style.opacity = '1';
            } else {
                membersList.style.maxHeight = '0';
                membersList.style.opacity = '0';
                setTimeout(() => {
                    membersList.style.display = 'none';
                }, 300);
                collapseIcon.textContent = '▶';
            }
        }

        async function loadJiraUsers() {
            try {
                const response = await fetch('/api/jira-users');
                const users = await response.json();
                
                const select = document.getElementById('jiraUserSelect');
                select.innerHTML = `<option value="">Select a user...</option>` +
                    users.map(user => `
                        <option value="${user.accountId}" 
                                data-email="${user.emailAddress}"
                                data-name="${user.displayName}">
                            ${user.displayName} (${user.emailAddress})
                        </option>
                    `).join('');
            } catch (error) {
                console.error('Error loading Jira users:', error);
            }
        }

        function showAddUserModal() {
            const modal = document.getElementById('addUserModal');
            modal.classList.remove('hidden');
            loadJiraUsers();
            updateSkillSelection();
        }

        function hideAddUserModal() {
            const modal = document.getElementById('addUserModal');
            modal.classList.add('hidden');
        }

        function updateSkillSelection() {
            const skillSelection = document.getElementById('skillSelection');
            skillSelection.innerHTML = AVAILABLE_SKILLS.map(skill => `
                <label class="inline-flex items-center bg-gray-700 px-3 py-1 rounded-full">
                    <input type="checkbox" value="${skill}" class="mr-2">
                    <span class="text-sm text-blue-300">${skill}</span>
                </label>
            `).join('');
        }

        // Add form submission handler
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const jiraUser = document.getElementById('jiraUserSelect');
            const selectedOption = jiraUser.options[jiraUser.selectedIndex];
            const skills = Array.from(document.querySelectorAll('#skillSelection input:checked'))
                .map(input => input.value);

            try {
                const response = await fetch('/api/members', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        jiraAccountId: jiraUser.value,
                        email: selectedOption.dataset.email,
                        name: document.getElementById('userName').value,
                        weeklyHours: parseInt(document.getElementById('weeklyHours').value),
                        skills: skills
                    })
                });

                if (!response.ok) throw new Error('Failed to add member');

                hideAddUserModal();
                loadMembers(); // Refresh the members list
                alert('Team member added successfully!');
            } catch (error) {
                console.error('Error adding member:', error);
                alert('Failed to add team member: ' + error.message);
            }
        });

        // Load members when the page loads
        document.addEventListener('DOMContentLoaded', loadMembers);

        // Load suggestions when the page loads
        document.addEventListener('DOMContentLoaded', loadAISuggestions);
    </script>

    <style>
        /* Add these styles to your existing styles */
        #skillsList {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            overflow: hidden;
        }

        #skillsHeader:hover {
            opacity: 0.8;
        }

        #skillsCollapseIcon {
            transition: transform 0.3s ease;
        }

        #membersList {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            overflow: hidden;
        }

        #addUserModal {
            z-index: 1000;
        }

        .modal-open {
            overflow: hidden;
        }
    </style>
</body>
</html>
